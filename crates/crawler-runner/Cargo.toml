[package]
name = "crawler-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crawler — chromiumoxide-based journey runner. Phase 3 of the TS→Rust port. MVP: launches Chromium, drives goto/wait/screenshot steps, captures console/pageerror/request-failed events, writes report.json."

[[bin]]
name = "crawler"
path = "src/main.rs"

[dependencies]
crawler-journey = { path = "../crawler-journey" }
crawler-report = { path = "../crawler-report" }

# Async runtime + HTTP/IO. tokio's `rt-multi-thread` for the
# chromiumoxide async-stream model; `macros` for #[tokio::main];
# `fs` for journey + screenshot writes.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "time", "sync"] }
futures = "0.3"

# CDP-based Chromium driver — see CRAWLER_STACK_AUDIT.md for the
# port decision. Bumped to 0.9 in T102.2 — Chromium 147 ships
# CDP messages 0.7's Message enum couldn't deserialize.
# 0.9 dropped the `tokio-runtime` feature (now default); use defaults.
chromiumoxide = "0.9"

# CLI + serialization.
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# T102.4: raw CDP WebSocket. Bypasses chromiumoxide's typed
# Message dispatch (which can't deserialize Chromium-147-era
# events). We open a SECOND WS on browser.websocket_address(),
# auto-attach to all targets, and parse events as untyped JSON.
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
