[package]
name = "crawler-mcp"
version = "0.1.0"
edition.workspace = true
description = "PlausiDen-Crawler MCP server — exposes reference-capture / journey / detector runs as JSON-RPC tools for token-efficient Claude / Codex / Cursor interaction. Per paul 2026-05-21."

[[bin]]
name = "crawler-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "process"] }
