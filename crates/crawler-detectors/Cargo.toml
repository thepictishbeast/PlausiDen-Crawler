[package]
name = "crawler-detectors"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crawler — page-side detector eval-function strings + typed result structs. The single source of truth for both the TypeScript Crawler (during the migration window) and the future chromiumoxide-based Rust Crawler."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
