[package]
name = "crawler-browser-matrix"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
description = "Typed cross-browser × device matrix for Crawler journeys. Runner instantiates the real engines; this crate is the typed contract + result-grid shape."

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
