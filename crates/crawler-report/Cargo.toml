[package]
name = "crawler-report"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crawler — typed report shape (CapturedEvent / Report / Diff). Wire-compatible with PlausiDen-Forge::forge_core::Finding so the JSON written by Crawler deserializes into Forge's log-replay tool without a translation layer. Phase 2 of the TS→Rust port."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
