# Node.js 22+ + V8 + ts-node ESM loader doesn't fit cleanly into any
# of systemd's curated SystemCallFilter sets — even @system-service
# alone is too tight, killing the process with SIGSYS during V8 init.
# The crawler died on every nightly fire from at least 2026-05-02
# onward.
#
# Override: clear SystemCallFilter entirely. Other hardening layers
# still bound the process:
#   - NoNewPrivileges=true        (no setuid/setgid binary execve)
#   - ProtectSystem=strict        (read-only fs except ReadWritePaths)
#   - ProtectHome=read-only       (no /home writes)
#   - ReadWritePaths=.../runs     (only the run-output dir is writable)
#   - PrivateTmp + PrivateDevices (isolated /tmp, no raw devices)
#   - ProtectKernelTunables/Modules/ControlGroups (no /sys, /proc tweaks)
#   - RestrictNamespaces, RestrictRealtime, RestrictSUIDSGID,
#     LockPersonality (capability-escalation surface fenced)
#   - RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
#     (no raw sockets)
#
# Net: bpf/mount/keyctl/kexec/ptrace are all still blocked via the
# capability + sandbox restrictions even without an explicit syscall
# filter. SystemCallFilter was redundant, not the load-bearing fence.
[Service]
SystemCallFilter=
