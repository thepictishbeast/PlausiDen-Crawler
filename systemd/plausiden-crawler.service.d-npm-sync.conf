# Keep node_modules in sync with package-lock.json before every run.
# Idempotent: if the lockfile already matches what's installed, npm
# returns in ~5s. Without this, an `axe-core` (or similar) addition
# to package.json that ships in a `git pull` but isn't followed by
# `npm install` makes the next nightly fire die with MODULE_NOT_FOUND.
[Service]
ExecStartPre=/usr/bin/npm install --prefix /home/admin/PlausiDen-Crawler --no-save --silent --no-audit --no-fund
