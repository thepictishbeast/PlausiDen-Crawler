# PlausiDen-Crawler — Rust workspace.
#
# Established 2026-05-04 per CRAWLER_STACK_AUDIT.md decision: port
# the TypeScript Crawler to Rust + chromiumoxide in 6 phases.
#
# Phase 1 (this commit): extract page-side detector eval-function
# strings + their typed result structs into a `crawler-detectors`
# crate. Both the existing TS Crawler and the future Rust Crawler
# will consume from this single source of truth — eliminating the
# class of bugs where a JS evalFn drifts from its TS-side type.
#
# Phases 2-6 land subsequently:
#   2. crawler-report (shared with forge-core::Finding shape)
#   3. minimal chromiumoxide journey runner (1 axis parity)
#   4. all 12 detector axes ported
#   5. UX-persona journeys (5 personas)
#   6. retire `npm run audit`, switch CI to cargo

[workspace]
resolver = "2"
members = [
    "crates/crawler-detectors",
    "crates/crawler-report",
    "crates/crawler-journey",
    "crates/crawler-runner",
    # T58: typed debug-capture metadata + HAR shape. Runner does
    # the IO; this crate is the cross-runner contract.
    "crates/crawler-debug-capture",
    # T59: typed cross-browser × device matrix config + result
    # grid. Runner instantiates the real engines; this crate is
    # the cross-runner contract.
    "crates/crawler-browser-matrix",
    # #116: Galen-style layout-assertion DSL — operator-authored
    # specs ("logo inside header top-left, 0-40px"). Typed surface
    # ships here; runner that consumes a LayoutSpec + DOM-bounds
    # snapshot is a follow-up.
    "crates/crawler-layout-spec",
    # #298: typed wire shape for headless reference-site captures.
    # Mirrors PlausiDen-Forge::forge-core::reference_capture so the
    # chromiumoxide runner can emit the manifest forge-core
    # extractors consume. Contract only; runner does the IO.
    "crates/crawler-reference-capture",
    # #326 (paul 2026-05-21): crawler-mcp — Model Context Protocol
    # server exposing reference-capture / journey / detector runs
    # as JSON-RPC tools. Survives `cargo clean`; standardises the
    # screenshot+detect+diff loop across sessions. Mirrors the
    # forge-mcp pattern (PlausiDen-Forge PR #26).
    "crates/crawler-mcp",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "AGPL-3.0-or-later"
repository = "https://github.com/thepictishbeast/PlausiDen-Crawler"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
