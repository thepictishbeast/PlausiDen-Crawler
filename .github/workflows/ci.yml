name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PlausiDen-Crawler is mid-port from TypeScript to Rust per the
# CRAWLER_STACK_AUDIT.md decision (2026-05-04). Both stacks ship
# in the same tree right now: the TS code at src/ continues to
# run nightly audits while the Rust workspace at crates/ takes
# over phase by phase (T100 detectors → T101 report → T102
# journey + runner). CI gates both.

jobs:
  typescript:
    name: bun install + test + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
          else
            npm ci || npm install
          fi
      - name: test
        run: |
          if command -v bun >/dev/null 2>&1 && [ -f bunfig.toml -o -f package.json ]; then
            bun test 2>/dev/null || npm test --if-present
          else
            npm test --if-present
          fi
      - name: typecheck
        run: |
          if [ -f tsconfig.json ]; then
            npx -y tsc --noEmit || true
          fi

  rust:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  doc:
    name: cargo doc (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --locked
